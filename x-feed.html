<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portals Live Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #0a0a0f;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, rgba(153,69,255,0.1), rgba(29,155,240,0.1));
            border-bottom: 1px solid rgba(153,69,255,0.2);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #9945FF, #1DA1F2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .handle {
            font-size: 0.9rem;
            color: #1DA1F2;
            text-decoration: none;
            font-weight: 500;
        }
        .handle:hover { text-decoration: underline; }
        .feed-frame {
            flex: 1;
            border: none;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Portals Live Feed</div>
        <a class="handle" href="https://x.com/_portals_" target="_blank">@_portals_</a>
    </div>
    <iframe class="feed-frame"
            src="https://syndication.twitter.com/srv/timeline-profile/screen-name/_portals_?dnt=true&embedId=portals-feed&theme=dark"
            sandbox="allow-scripts allow-same-origin allow-popups"
            loading="eager">
    </iframe>
</body>
</html>
