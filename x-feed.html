<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portals Live Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, rgba(153,69,255,0.1), rgba(29,155,240,0.1));
            border-bottom: 1px solid rgba(153,69,255,0.2);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .title {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #9945FF, #1DA1F2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .handle {
            font-size: 0.9rem;
            color: #1DA1F2;
            text-decoration: none;
            font-weight: 500;
        }
        .handle:hover { text-decoration: underline; }
        .feed-container {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 1.5rem;
            overflow-y: auto;
        }
        .timeline-wrapper {
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            overflow: hidden;
        }
        .footer {
            text-align: center;
            padding: 1rem;
            color: #666;
            font-size: 0.8rem;
            border-top: 1px solid rgba(153,69,255,0.1);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Portals Live Feed</div>
        <a class="handle" href="https://x.com/_portals_" target="_blank">@_portals_</a>
    </div>
    <div class="feed-container">
        <div class="timeline-wrapper">
            <a class="twitter-timeline"
               data-theme="dark"
               data-chrome="noheader nofooter noborders transparent"
               data-tweet-limit="20"
               href="https://twitter.com/_portals_">
                Loading @_portals_ feed...
            </a>
            <script async src="https://platform.twitter.com/widgets.js"></script>
        </div>
    </div>
    <div class="footer">Live feed from X.com</div>
</body>
</html>
