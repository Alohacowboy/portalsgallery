<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Comma Club Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(153,69,255,0.1));
            border-bottom: 1px solid rgba(255,215,0,0.2);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #9945FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .handle-link {
            font-size: 0.9rem;
            color: #FFD700;
            text-decoration: none;
            font-weight: 500;
        }
        .handle-link:hover { text-decoration: underline; }
        .feed { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .tweet {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
            transition: background 0.2s;
        }
        .tweet:hover { background: rgba(255,255,255,0.06); }
        @keyframes fadeIn { to { opacity: 1; } }
        .tweet-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
        }
        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tweet-name { font-weight: 600; font-size: 0.9rem; display: block; }
        .tweet-handle { color: #888; font-size: 0.8rem; }
        .tweet-date {
            margin-left: auto;
            color: #666;
            font-size: 0.75rem;
            text-decoration: none;
            white-space: nowrap;
        }
        .tweet-date:hover { color: #FFD700; }
        .tweet-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #e0e0e0;
            word-break: break-word;
        }
        .footer {
            text-align: center;
            padding: 1.5rem;
            color: #555;
            font-size: 0.8rem;
        }
        .footer a { color: #FFD700; text-decoration: none; }
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #888;
        }
        .spinner {
            display: inline-block;
            width: 40px; height: 40px;
            border: 3px solid rgba(255,215,0,0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { text-align: center; padding: 4rem 2rem; color: #888; }
        .error-title { font-size: 1.2rem; color: #fff; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">3 Comma Club</div>
        <a class="handle-link" href="https://x.com/alohacowboylabs" target="_blank">@alohacowboylabs</a>
    </div>
    <div class="feed" id="feed">
        <div class="loading">
            <div class="spinner"></div>
            <div>Loading feed...</div>
        </div>
    </div>
    <div class="footer"><a href="https://x.com/alohacowboylabs" target="_blank">View more on X</a></div>

    <script>
        const WORKER_URL = 'https://tres-commas-bot.sjschierling.workers.dev';

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function formatDate(isoStr) {
            const d = new Date(isoStr);
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function renderTweets(user, tweets) {
            const feed = document.getElementById('feed');
            if (!tweets || !tweets.length) {
                feed.innerHTML = '<div class="error"><div class="error-title">No posts yet</div><div style="margin-top:0.5rem;color:#888">Collect a Tres Commas bottle to see the first post!</div></div>';
                return;
            }
            feed.innerHTML = tweets.map((tw, i) => `
                <div class="tweet" style="animation-delay:${i * 0.04}s">
                    <div class="tweet-header">
                        <img class="avatar" src="${user.avatar}" alt="" loading="lazy">
                        <div>
                            <span class="tweet-name">${escapeHtml(user.name)}</span>
                            <span class="tweet-handle">@${user.handle}</span>
                        </div>
                        <a class="tweet-date" href="https://x.com/${user.handle}/status/${tw.id}" target="_blank">${formatDate(tw.created_at)}</a>
                    </div>
                    <div class="tweet-text">${escapeHtml(tw.text).replace(/\n/g, '<br>')}</div>
                </div>
            `).join('');
        }

        async function loadFeed() {
            try {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                renderTweets(data.tweets.user, data.tweets.tweets);
            } catch (e) {
                console.error('Feed load error:', e);
                document.getElementById('feed').innerHTML = `
                    <div class="error">
                        <div class="error-title">Couldn't load feed</div>
                        <div style="margin-top:0.5rem">
                            <a href="https://x.com/alohacowboylabs" target="_blank" style="color:#FFD700">View @alohacowboylabs on X</a>
                        </div>
                    </div>`;
            }
        }

        loadFeed();
    </script>
</body>
</html>
